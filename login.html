<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | Hon. Akarachi Amadi</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 30px 25px;
    border-radius: 12px;
    box-shadow: 0 4px 20px #00000015;
}

h2 {
    text-align: center;
    color: #075b32;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #666;
    font-size: 14px;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 18px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    background: #075b32;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message {
    display: none;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 15px;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.error {
    display: block;
    background: #ffebee;
    color: #b71c1c;
}

.success {
    display: block;
    background: #e1f5e7;
    color: #12612d;
}

.footer {
    text-align: center;
    font-size: 12px;
    color: #777;
    margin-top: 22px;
}
</style></head><body><div class="login-box"><h2>Hon. Akarachi Amadi</h2>

<p class="subtitle">
    Secure Election Management Dashboard
</p>

<div id="message" class="message"></div>

<form id="loginForm">

    <label for="email">Email Address</label>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="username"
        required
    >

    <label for="password">Password</label>

    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
    >

    <button type="submit" id="loginButton">
        Login
    </button>

</form>

<div class="footer">
    Authorised Personnel Only
</div>

</div><script>
const SUPABASE_URL =
"https://pxtgmpmhiktgknjksqeh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_da-QaN9XAEED_RQaHHHx2A_AkRwoQ3D";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = "message " + type;
}

async function checkUserRole(user) {

    const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("role,is_active,full_name")
        .eq("id", user.id)
        .maybeSingle();

    if (error) {
        throw new Error(
            "Unable to verify your account: " + error.message
        );
    }

    if (!profile) {
        throw new Error(
            "Your account profile was not found. Contact the administrator."
        );
    }

    if (profile.is_active !== true) {
        throw new Error(
            "Your account is not active. Contact the administrator."
        );
    }

    if (profile.role === "admin") {
        return "admin";
    }

    if (profile.role === "agent") {
        return "agent";
    }

    throw new Error(
        "Your account does not have an authorised dashboard role."
    );
}

async function redirectUser(user) {

    const role = await checkUserRole(user);

    showMessage("Authentication successful. Opening dashboard...", "success");

    if (role === "admin") {
        window.location.replace("admin.html");
        return;
    }

    if (role === "agent") {
        window.location.replace("agent.html");
        return;
    }
}

// Check existing login without blocking the login form
async function checkExistingSession() {

    try {
        const { data, error } = await supabaseClient.auth.getSession();

        if (error) {
            console.error("Session check:", error.message);
            return;
        }

        if (data.session && data.session.user) {
            await redirectUser(data.session.user);
        }

    } catch (error) {
        console.error("Existing session check:", error.message);
    }
}

// Login form submission
form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Logging in...";

    message.className = "message";
    message.style.display = "none";

    try {

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            throw new Error(error.message);
        }

        if (!data.user) {
            throw new Error("Login failed. Please try again.");
        }

        await redirectUser(data.user);

    } catch(error) {

        showMessage(error.message, "error");

        button.disabled = false;
        button.textContent = "Login";

    }

});

// Run session check after page loads
checkExistingSession();
</script></body>
</html>
